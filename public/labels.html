<style>
  @font-face { font-family: "Plex Sans"; src: url(fonts/IBMPlexSans-Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Plex Sans"; src: url(fonts/IBMPlexSans-SemiBold.woff2) format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Plex Sans"; src: url(fonts/IBMPlexSans-Bold.woff2) format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Plex Mono"; src: url(fonts/IBMPlexMono-Medium.woff2) format("woff2"); font-weight: 500; font-display: swap; }
  * { box-sizing: border-box; }
  body { margin: 0; color: #1a1d21; background: #fff; font: 15px/1.4 "Plex Sans", system-ui, sans-serif; }
  a:focus-visible { outline: 3px solid #f2b21b; outline-offset: 2px; }
  header { background: #1a1d21; color: #f5f3ee; }
  .top { max-width: 1100px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .mark { width: 34px; height: 34px; border-radius: 7px; background: #f2b21b; color: #1a1d21; display: grid; place-items: center; font: 600 13px "Plex Mono", ui-monospace, monospace; flex: none; }
  .brand { margin: 0; font-size: 20px; font-weight: 700; }
  nav { display: flex; gap: 2px; margin-left: auto; }
  nav a { color: #f5f3ee; font-weight: 600; font-size: 15px; padding: 0 10px; min-height: 44px; display: inline-flex; align-items: center; border-radius: 6px; text-decoration: none; }
  nav a:hover { background: rgb(245 243 238 / .12); }
  nav a[aria-current="page"] { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 24px 40px; }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; }
  main > p { margin: 0 0 18px; color: #4f5660; max-width: 70ch; }
  .labels { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .label { border: 1px solid #1a1d21; border-radius: 6px; padding: 14px 16px 10px; break-inside: avoid; }
  .label strong { display: block; font-size: 16px; }
  .label svg { display: block; width: 100%; height: 70px; margin: 10px 0 4px; }
  .label code { font: 500 14px "Plex Mono", ui-monospace, monospace; letter-spacing: 2px; }
  @media (max-width: 520px) { .top, main { padding-left: 12px; padding-right: 12px; } nav { margin-left: -10px; width: 100%; } }
  /* Printed, the page is just the labels. */
  @media print { header, h1, main > p { display: none; } main { padding: 0; max-width: none; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="mark" aria-hidden="true">1×</div>
    <p class="brand">CountOnce</p>
    <nav aria-label="Site"><a href="/">Dashboard</a><a href="/try">Try it</a><a href="/try-api">API</a><a href="/labels" aria-current="page">Labels</a></nav>
  </div>
</header>
<main>
<h1>Shelf labels</h1>
<p id="intro">One label per item. Print this page and stick each label on its shelf. The staff app reads the barcode to know which item it is.</p>
<div class="labels" id="labels"></div>
</main>
<script>
// Opened from the Try it page (?visitor=ID), the labels are for scanning from the screen, not for printing.
if (/^[A-Z0-9]{8}$/.test(new URLSearchParams(location.search).get("visitor") ?? "")) {
  document.getElementById("intro").textContent =
    "Scan any label on this screen with the app on your phone. The app opens your practice copy of that item, so the real stock is not affected. Your copies have their own codes, which start with DEMO.";
}

// Code 128 (set B): each symbol is 6 bar/space widths. Index i is the pattern for value i.
const PATTERNS = ("212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 " +
  "122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 " +
  "212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 " +
  "113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 " +
  "431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 " +
  "241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 " +
  "131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112").split(" ");
const START_B = 104, STOP = 106;

function code128(text) {
  const values = [START_B, ...[...text].map((c) => c.charCodeAt(0) - 32)];
  const check = values.reduce((sum, v, i) => sum + v * (i || 1), 0) % 103;
  const widths = [...values, check, STOP].map((v) => PATTERNS[v]).join("");
  // Draw: odd positions are bars, even are spaces; 10 units of quiet zone on each side.
  let x = 10, bars = "";
  [...widths].forEach((w, i) => {
    if (i % 2 === 0) bars += `<rect x="${x}" y="0" width="${w}" height="60"/>`;
    x += Number(w);
  });
  return `<svg viewBox="0 0 ${x + 10} 60" preserveAspectRatio="none" role="img" aria-label="Barcode ${text}">${bars}</svg>`;
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
fetch("/api/state").then((r) => r.json()).then((s) => {
  document.getElementById("labels").innerHTML = s.items.filter((i) => !i.id.startsWith("DEMO-")).map((i) => `
    <div class="label"><strong>${esc(i.name)}</strong>${code128(i.id)}<code>${esc(i.id)}</code></div>`).join("");
}).catch(() => { document.getElementById("labels").textContent = "Could not reach the server. Reload the page."; });
</script>
</body>
</html>
