name: countonce
description: "CountOnce: shared stock counts that stay right, even offline"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0              # talks to the stock API
  shared_preferences: ^2.5.6 # keeps the outbox, the name and the staff key on the phone
  uuid: ^4.6.0              # a request id for each scan
  mobile_scanner: ^7.4.2    # the camera barcode scanner

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # IBM Plex, the type used by the dashboard too (SIL Open Font License, fonts/OFL.txt)
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: fonts/IBMPlexSans-Regular.ttf
        - asset: fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
